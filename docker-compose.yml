services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tuneai
      POSTGRES_USER: tuneai
      POSTGRES_PASSWORD: tuneai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuneai -d tuneai"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tuneai:tuneai@postgres:5432/tuneai
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      UPLOAD_DIR: /data/uploads
      TEST_CREATOR_ROLES: ${TEST_CREATOR_ROLES:-student,methodist,teacher,interviewer,admin}
      ANSWER_REVIEWER_ROLES: ${ANSWER_REVIEWER_ROLES:-teacher,interviewer,admin}
      DEMO_BOOTSTRAP_ENABLED: ${DEMO_BOOTSTRAP_ENABLED:-true}
      DEMO_BOOTSTRAP_LIMIT_PER_HOUR: ${DEMO_BOOTSTRAP_LIMIT_PER_HOUR:-30}
      DEMO_BOOTSTRAP_TTL_HOURS: ${DEMO_BOOTSTRAP_TTL_HOURS:-24}
      MOODLE_INTEGRATION_ENABLED: ${MOODLE_INTEGRATION_ENABLED:-false}
      MOODLE_INTEGRATION_TOKEN: ${MOODLE_INTEGRATION_TOKEN:-}
      RUNTIME_AI_PROVIDER_CONFIG_ENABLED: ${RUNTIME_AI_PROVIDER_CONFIG_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOW_CREDENTIALS: "true"
    entrypoint: []
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tuneai:tuneai@postgres:5432/tuneai
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      UPLOAD_DIR: /data/uploads
      TEST_CREATOR_ROLES: ${TEST_CREATOR_ROLES:-student,methodist,teacher,interviewer,admin}
      ANSWER_REVIEWER_ROLES: ${ANSWER_REVIEWER_ROLES:-teacher,interviewer,admin}
      DEMO_BOOTSTRAP_ENABLED: ${DEMO_BOOTSTRAP_ENABLED:-true}
      DEMO_BOOTSTRAP_LIMIT_PER_HOUR: ${DEMO_BOOTSTRAP_LIMIT_PER_HOUR:-30}
      DEMO_BOOTSTRAP_TTL_HOURS: ${DEMO_BOOTSTRAP_TTL_HOURS:-24}
      MOODLE_INTEGRATION_ENABLED: ${MOODLE_INTEGRATION_ENABLED:-false}
      MOODLE_INTEGRATION_TOKEN: ${MOODLE_INTEGRATION_TOKEN:-}
      RUNTIME_AI_PROVIDER_CONFIG_ENABLED: ${RUNTIME_AI_PROVIDER_CONFIG_ENABLED:-true}
    entrypoint: []
    command: python -m app.worker
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tuneai:tuneai@postgres:5432/tuneai
      UPLOAD_DIR: /data/uploads
    entrypoint: []
    command: python -m app.scripts.seed_demo
    profiles:
      - demo
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_TUNEAI_TEMPLATE: ${NEXT_PUBLIC_TUNEAI_TEMPLATE:-unconfigured}
        NEXT_PUBLIC_TUNEAI_PRODUCT_NAME: ${NEXT_PUBLIC_TUNEAI_PRODUCT_NAME:-}
        NEXT_PUBLIC_TUNEAI_LOGO_TEXT: ${NEXT_PUBLIC_TUNEAI_LOGO_TEXT:-}
        NEXT_PUBLIC_TUNEAI_LOGO_URL: ${NEXT_PUBLIC_TUNEAI_LOGO_URL:-}
        NEXT_PUBLIC_TUNEAI_REPOSITORY_URL: ${NEXT_PUBLIC_TUNEAI_REPOSITORY_URL:-https://github.com/CRUDoshleps/TuneAI}
        NEXT_PUBLIC_TUNEAI_DOCS_URL: ${NEXT_PUBLIC_TUNEAI_DOCS_URL:-https://github.com/CRUDoshleps/TuneAI}
        NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL:-}
        NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON:-}
        NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR: ${NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR:-}
        NEXT_PUBLIC_TUNEAI_SURFACE_COLOR: ${NEXT_PUBLIC_TUNEAI_SURFACE_COLOR:-}
        NEXT_PUBLIC_TUNEAI_PANEL_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_COLOR:-}
        NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR:-}
        NEXT_PUBLIC_TUNEAI_TEXT_COLOR: ${NEXT_PUBLIC_TUNEAI_TEXT_COLOR:-}
        NEXT_PUBLIC_TUNEAI_MUTED_COLOR: ${NEXT_PUBLIC_TUNEAI_MUTED_COLOR:-}
        NEXT_PUBLIC_TUNEAI_LINE_COLOR: ${NEXT_PUBLIC_TUNEAI_LINE_COLOR:-}
        NEXT_PUBLIC_TUNEAI_ACCENT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_COLOR:-}
        NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR:-}
        NEXT_PUBLIC_TUNEAI_DANGER_COLOR: ${NEXT_PUBLIC_TUNEAI_DANGER_COLOR:-}
        NEXT_PUBLIC_TUNEAI_WARNING_COLOR: ${NEXT_PUBLIC_TUNEAI_WARNING_COLOR:-}
        NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR: ${NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR:-}
        NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS: ${NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS:-${EMBED_ALLOWED_ORIGINS:-}}
        NEXT_PUBLIC_TUNEAI_CONFIG_JSON: ${NEXT_PUBLIC_TUNEAI_CONFIG_JSON:-}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_TUNEAI_TEMPLATE: ${NEXT_PUBLIC_TUNEAI_TEMPLATE:-unconfigured}
      NEXT_PUBLIC_TUNEAI_PRODUCT_NAME: ${NEXT_PUBLIC_TUNEAI_PRODUCT_NAME:-}
      NEXT_PUBLIC_TUNEAI_LOGO_TEXT: ${NEXT_PUBLIC_TUNEAI_LOGO_TEXT:-}
      NEXT_PUBLIC_TUNEAI_LOGO_URL: ${NEXT_PUBLIC_TUNEAI_LOGO_URL:-}
      NEXT_PUBLIC_TUNEAI_REPOSITORY_URL: ${NEXT_PUBLIC_TUNEAI_REPOSITORY_URL:-https://github.com/CRUDoshleps/TuneAI}
      NEXT_PUBLIC_TUNEAI_DOCS_URL: ${NEXT_PUBLIC_TUNEAI_DOCS_URL:-https://github.com/CRUDoshleps/TuneAI}
      NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL:-}
      NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON:-}
      NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR: ${NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR:-}
      NEXT_PUBLIC_TUNEAI_SURFACE_COLOR: ${NEXT_PUBLIC_TUNEAI_SURFACE_COLOR:-}
      NEXT_PUBLIC_TUNEAI_PANEL_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_COLOR:-}
      NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_TEXT_COLOR: ${NEXT_PUBLIC_TUNEAI_TEXT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_MUTED_COLOR: ${NEXT_PUBLIC_TUNEAI_MUTED_COLOR:-}
      NEXT_PUBLIC_TUNEAI_LINE_COLOR: ${NEXT_PUBLIC_TUNEAI_LINE_COLOR:-}
      NEXT_PUBLIC_TUNEAI_ACCENT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_DANGER_COLOR: ${NEXT_PUBLIC_TUNEAI_DANGER_COLOR:-}
      NEXT_PUBLIC_TUNEAI_WARNING_COLOR: ${NEXT_PUBLIC_TUNEAI_WARNING_COLOR:-}
      NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR: ${NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR:-}
      NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS: ${NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS:-${EMBED_ALLOWED_ORIGINS:-}}
      NEXT_PUBLIC_TUNEAI_CONFIG_JSON: ${NEXT_PUBLIC_TUNEAI_CONFIG_JSON:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  uploads:
