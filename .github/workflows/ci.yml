name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuneai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-policy:
    name: CI supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require immutable action and base-image references
        run: python scripts/check-ci-pins.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q
      - name: Audit Python runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
      - name: Validate Alembic migrations
        env:
          DATABASE_URL: sqlite:////tmp/tuneai-ci-migrations.db
          SECRET_KEY: ci-secret-key-for-migrations
          UPLOAD_DIR: /tmp/tuneai-ci-uploads
        run: alembic upgrade head

  postgres-migrations:
    name: PostgreSQL migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: tuneai
          POSTGRES_USER: tuneai
          POSTGRES_PASSWORD: tuneai-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuneai -d tuneai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://tuneai:tuneai-ci-password@127.0.0.1:5432/tuneai
      SECRET_KEY: ci-secret-key-for-postgres-migrations
      UPLOAD_DIR: /tmp/tuneai-ci-postgres-uploads
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Rehearse production migration path
        run: |
          alembic upgrade 0003_add_answer_review
          python - <<'PY'
          import os

          import sqlalchemy as sa

          engine = sa.create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(sa.text("DROP TABLE IF EXISTS ai_provider_configs CASCADE"))
          PY
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "0017_mixed_questions_import"

  frontend:
    name: Frontend tests, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --test-reporter=spec
      - name: Build
        run: npm run build
      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

  moodle-e2e:
    name: Moodle Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show Docker versions
        run: |
          docker --version
          docker compose version
      - name: Free unused Docker space
        run: docker system prune -af || true
      - name: Run Moodle integration smoke test
        run: tests/moodle/run-moodle-e2e.sh
      - name: Package Moodle plugin
        run: scripts/package-moodle-plugin.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local_tuneai
          path: dist/local_tuneai.zip
          retention-days: 7
          if-no-files-found: error

  self-host-config:
    name: Self-host compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Docker Compose files
        env:
          REGISTRY_IMAGE: ghcr.io/example/tuneai
          IMAGE_TAG: ci
          POSTGRES_HOST: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          MINIO_ROOT_PASSWORD: ci-minio-password
          PUBLIC_ORIGIN: https://tuneai.example.edu
          TUNEAI_DOMAIN: tuneai.example.edu
          MOODLE_INTEGRATION_TOKEN: ci-moodle-token
        run: |
          cp .env.example .env
          docker compose config >/tmp/tuneai-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.moodle.yml config >/tmp/tuneai-moodle-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.moodle.local.yml config >/tmp/tuneai-moodle-local-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/tmp/tuneai-prod-compose.yml
          docker compose -f deploy/compose.yaml config >/tmp/tuneai-deploy-compose.yml
          docker compose --profile demo config --format json >/tmp/tuneai-compose.json
          python - <<'PY'
          import json

          with open("/tmp/tuneai-compose.json", encoding="utf-8") as compose_file:
              services = json.load(compose_file)["services"]
          assert services["worker"]["depends_on"]["backend"]["condition"] == "service_healthy"
          assert services["seed"]["depends_on"]["backend"]["condition"] == "service_healthy"
          PY

  deployment-config:
    name: Production deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate shell scripts
        run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate Docker Compose
        env:
          REGISTRY_IMAGE: cr.yandex/example00000000000000/tuneai
          IMAGE_TAG: sha-0000000000000000000000000000000000000000
          POSTGRES_HOST: postgres.example.internal
          YANDEX_FOLDER_ID: example00000000000000
        run: |
          docker compose --profile tools -f deploy/compose.yaml config --format json >/tmp/tuneai-production-compose.json
          python - <<'PY'
          import json

          with open("/tmp/tuneai-production-compose.json", encoding="utf-8") as compose_file:
              services = json.load(compose_file)["services"]
          environment = services["backend"]["environment"]
          assert environment["YANDEX_USE_METADATA_IAM"] == "false"
          assert environment["DEMO_BOOTSTRAP_ENABLED"] == "true"
          assert environment["DEMO_BOOTSTRAP_LIMIT_PER_HOUR"] == "20"
          assert environment["DEMO_BOOTSTRAP_TTL_HOURS"] == "6"
          assert any(secret["source"] == "yandex_api_key" for secret in services["bootstrap-admin"]["secrets"])
          PY
          grep -q 'app.scripts.check_ai' deploy/deploy.sh
          grep -q '/opt/tuneai-deploy' backend/Dockerfile
          grep -q 'sync_release_deploy_files' deploy/watch-registry.sh

  release:
    name: Publish and deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ci-policy, backend, postgres-migrations, frontend, moodle-e2e, self-host-config, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tuneai-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      HEALTH_URL: https://tuneai.vnshk.ru/api/health
      PUBLIC_ORIGIN: https://tuneai.vnshk.ru
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate required Yandex Cloud variables
        env:
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
        run: |
          test "${#YC_REGISTRY_ID}" -eq 20
          test "${#YC_SERVICE_ACCOUNT_ID}" -eq 20
          echo "REGISTRY_IMAGE=cr.yandex/${YC_REGISTRY_ID}/tuneai" >> "$GITHUB_ENV"

      - name: Build immutable backend image
        run: |
          docker build \
            --file backend/Dockerfile \
            --build-arg "APP_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${REGISTRY_IMAGE}/backend:${IMAGE_TAG}" \
            .

      - name: Build immutable frontend image
        env:
          NEXT_PUBLIC_TUNEAI_TEMPLATE: ${{ vars.NEXT_PUBLIC_TUNEAI_TEMPLATE || 'official' }}
          NEXT_PUBLIC_TUNEAI_PRODUCT_NAME: ${{ vars.NEXT_PUBLIC_TUNEAI_PRODUCT_NAME || 'TuneAI' }}
          NEXT_PUBLIC_TUNEAI_LOGO_TEXT: ${{ vars.NEXT_PUBLIC_TUNEAI_LOGO_TEXT || 'TuneAI' }}
          NEXT_PUBLIC_TUNEAI_LOGO_URL: ${{ vars.NEXT_PUBLIC_TUNEAI_LOGO_URL }}
          NEXT_PUBLIC_TUNEAI_REPOSITORY_URL: ${{ vars.NEXT_PUBLIC_TUNEAI_REPOSITORY_URL || 'https://github.com/CRUDoshleps/TuneAI' }}
          NEXT_PUBLIC_TUNEAI_DOCS_URL: ${{ vars.NEXT_PUBLIC_TUNEAI_DOCS_URL || 'https://github.com/CRUDoshleps/TuneAI#быстрый-запуск' }}
          NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL: ${{ vars.NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL }}
          NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON: ${{ vars.NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON }}
          NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR }}
          NEXT_PUBLIC_TUNEAI_SURFACE_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_SURFACE_COLOR }}
          NEXT_PUBLIC_TUNEAI_PANEL_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_PANEL_COLOR }}
          NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR }}
          NEXT_PUBLIC_TUNEAI_TEXT_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_TEXT_COLOR }}
          NEXT_PUBLIC_TUNEAI_MUTED_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_MUTED_COLOR }}
          NEXT_PUBLIC_TUNEAI_LINE_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_LINE_COLOR }}
          NEXT_PUBLIC_TUNEAI_ACCENT_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_ACCENT_COLOR }}
          NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR }}
          NEXT_PUBLIC_TUNEAI_DANGER_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_DANGER_COLOR }}
          NEXT_PUBLIC_TUNEAI_WARNING_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_WARNING_COLOR }}
          NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR: ${{ vars.NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR }}
          NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS: ${{ vars.NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS }}
          NEXT_PUBLIC_TUNEAI_CONFIG_JSON: ${{ vars.NEXT_PUBLIC_TUNEAI_CONFIG_JSON }}
        run: |
          docker build \
            --file frontend/Dockerfile \
            --build-arg "NEXT_PUBLIC_TUNEAI_TEMPLATE=${NEXT_PUBLIC_TUNEAI_TEMPLATE}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_PRODUCT_NAME=${NEXT_PUBLIC_TUNEAI_PRODUCT_NAME}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_LOGO_TEXT=${NEXT_PUBLIC_TUNEAI_LOGO_TEXT}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_LOGO_URL=${NEXT_PUBLIC_TUNEAI_LOGO_URL}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_REPOSITORY_URL=${NEXT_PUBLIC_TUNEAI_REPOSITORY_URL}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_DOCS_URL=${NEXT_PUBLIC_TUNEAI_DOCS_URL}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL=${NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON=${NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR=${NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_SURFACE_COLOR=${NEXT_PUBLIC_TUNEAI_SURFACE_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_PANEL_COLOR=${NEXT_PUBLIC_TUNEAI_PANEL_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR=${NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_TEXT_COLOR=${NEXT_PUBLIC_TUNEAI_TEXT_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_MUTED_COLOR=${NEXT_PUBLIC_TUNEAI_MUTED_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_LINE_COLOR=${NEXT_PUBLIC_TUNEAI_LINE_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_ACCENT_COLOR=${NEXT_PUBLIC_TUNEAI_ACCENT_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR=${NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_DANGER_COLOR=${NEXT_PUBLIC_TUNEAI_DANGER_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_WARNING_COLOR=${NEXT_PUBLIC_TUNEAI_WARNING_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR=${NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS=${NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS}" \
            --build-arg "NEXT_PUBLIC_TUNEAI_CONFIG_JSON=${NEXT_PUBLIC_TUNEAI_CONFIG_JSON}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${REGISTRY_IMAGE}/frontend:${IMAGE_TAG}" \
            .

      - name: Smoke test production images
        run: |
          backend_revision="$(docker run --rm --entrypoint python "${REGISTRY_IMAGE}/backend:${IMAGE_TAG}" -c 'from app.core.config import get_settings; print(get_settings().app_revision)')"
          test "$backend_revision" = "$GITHUB_SHA"

          docker run --detach --name tuneai-frontend-smoke --publish 127.0.0.1:3000:3000 "${REGISTRY_IMAGE}/frontend:${IMAGE_TAG}"
          trap 'docker rm --force tuneai-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          docker logs tuneai-frontend-smoke
          exit 1

      - name: Scan images for embedded secrets
        run: |
          for image in "${REGISTRY_IMAGE}/backend:${IMAGE_TAG}" "${REGISTRY_IMAGE}/frontend:${IMAGE_TAG}"; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image \
              --scanners secret \
              --exit-code 1 \
              --no-progress \
              "$image"
          done

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          result-encoding: string
          script: |
            const token = await core.getIDToken('https://github.com/CRUDoshleps')
            core.setSecret(token)
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(`OIDC iss=${claims.iss} aud=${JSON.stringify(claims.aud)} sub=${claims.sub}`)
            return token

      - name: Exchange OIDC token for short-lived Yandex IAM token
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
        run: |
          response_file="$(mktemp)"
          status_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
              --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
              --data-urlencode "audience=${YC_SERVICE_ACCOUNT_ID}" \
              --data-urlencode "subject_token=${OIDC_TOKEN}" \
              --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
              https://auth.yandex.cloud/oauth/token
          )"
          if [[ "$status_code" != 200 ]]; then
            jq -c '{error, error_description}' "$response_file" >&2
            exit 1
          fi
          iam_token="$(jq -er '.access_token' "$response_file")"
          echo "::add-mask::${iam_token}"
          echo "YC_IAM_TOKEN=${iam_token}" >> "$GITHUB_ENV"

      - name: Publish complete release to Yandex Container Registry
        run: |
          printf '%s' "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker push "${REGISTRY_IMAGE}/backend:${IMAGE_TAG}"
          docker push "${REGISTRY_IMAGE}/frontend:${IMAGE_TAG}"
          docker logout cr.yandex

      - name: Wait for VM rollout and verify exact revision
        run: |
          stable_checks=0
          for attempt in {1..90}; do
            body="$(curl --fail --silent --show-error --max-time 5 "$HEALTH_URL" || true)"
            if jq -e --arg revision "$GITHUB_SHA" \
              '.status == "ok" and .version == $revision' <<<"$body" >/dev/null 2>&1
            then
              config="$(curl --fail --silent --show-error --max-time 5 "$PUBLIC_ORIGIN/api/public/config" || true)"
              ai_readiness="$(curl --fail --silent --show-error --max-time 30 "$PUBLIC_ORIGIN/api/readiness/ai/deep" || true)"
              if curl --fail --silent --show-error --max-time 5 "$PUBLIC_ORIGIN/" >/dev/null \
                && jq -e '.config.template == "official" and .config.productName == "TuneAI" and .config.demoBootstrapEnabled == true' \
                  <<<"$config" >/dev/null 2>&1 \
                && jq -e '.status == "ready" and (.details | contains("Embedding")) and (.details | contains("completion"))' \
                  <<<"$ai_readiness" >/dev/null 2>&1
              then
                stable_checks=$((stable_checks + 1))
                if [[ "$stable_checks" -ge 2 ]]; then
                  echo "TuneAI ${GITHUB_SHA} is stably healthy, AI-ready, and serves the official production UI"
                  exit 0
                fi
              else
                stable_checks=0
              fi
            else
              stable_checks=0
            fi
            sleep 10
          done
          echo "Production did not expose ${GITHUB_SHA}; inspect tuneai-deploy.service on prod-app-01." >&2
          exit 1
