services:
  postgres:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      MOODLE_INTEGRATION_ENABLED: "true"
      MOODLE_INTEGRATION_TOKEN: tuneai-moodle-e2e-token
      YANDEX_MOCK: "true"

  worker:
    environment:
      MOODLE_INTEGRATION_ENABLED: "true"
      MOODLE_INTEGRATION_TOKEN: tuneai-moodle-e2e-token
      YANDEX_MOCK: "true"

  moodle-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
    volumes:
      - moodle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  moodle:
    image: erseco/alpine-moodle:latest
    environment:
      SITE_URL: http://localhost:8080
      DB_TYPE: pgsql
      DB_HOST: moodle-postgres
      DB_PORT: 5432
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: moodle-e2e-admin-password
      MOODLE_EMAIL: admin@example.edu
      MOODLE_SITENAME: TuneAI_Moodle_E2E
      DEBUG: "false"
    ports:
      - "${MOODLE_E2E_HOST_PORT:-18080}:8080"
    volumes:
      - moodle-html-data:/var/www/html
      - moodledata-data:/var/www/moodledata
      - ./integrations/moodle/local_tuneai:/var/www/html/public/local/tuneai:ro
      - ./tests/moodle:/tuneai-moodle-tests:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login/index.php >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 90s
    depends_on:
      moodle-postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  moodle-postgres-data:
  moodle-html-data:
  moodledata-data:
