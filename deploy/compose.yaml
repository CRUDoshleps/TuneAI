name: tuneai

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_REVISION: ${IMAGE_TAG:?IMAGE_TAG is required}
  POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
  YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
  YANDEX_MOCK: "false"
  # VM metadata is not reachable through the current Docker bridge. Keep this
  # configurable so metadata IAM can be enabled after a scoped host proxy is
  # introduced, while production continues to use the Lockbox API key.
  YANDEX_USE_METADATA_IAM: ${YANDEX_USE_METADATA_IAM:-false}
  YANDEX_DATA_LOGGING_ENABLED: "false"
  RUNTIME_AI_PROVIDER_CONFIG_ENABLED: ${RUNTIME_AI_PROVIDER_CONFIG_ENABLED:-true}
  CORS_ORIGINS: https://tuneai.vnshk.ru
  CORS_ALLOW_CREDENTIALS: "true"
  DOCS_ENABLED: "false"
  METRICS_ENABLED: "false"
  INIT_DB_ON_STARTUP: "false"
  STORAGE_BACKEND: local
  UPLOAD_DIR: /data/uploads
  MAX_UPLOAD_MB: "50"
  DEMO_BOOTSTRAP_ENABLED: "true"
  DEMO_BOOTSTRAP_LIMIT_PER_HOUR: ${DEMO_BOOTSTRAP_LIMIT_PER_HOUR:-20}
  DEMO_BOOTSTRAP_TTL_HOURS: ${DEMO_BOOTSTRAP_TTL_HOURS:-6}
  MOODLE_INTEGRATION_ENABLED: ${MOODLE_INTEGRATION_ENABLED:-false}
  MOODLE_INTEGRATION_TOKEN: ${MOODLE_INTEGRATION_TOKEN:-}
  MOODLE_INTEGRATION_SITE_ID: ${MOODLE_INTEGRATION_SITE_ID:-default}
  MOODLE_INTEGRATION_OWNER_EMAILS: ${MOODLE_INTEGRATION_OWNER_EMAILS:-}
  TEST_CREATOR_ROLES: ${TEST_CREATOR_ROLES:-student,methodist,teacher,interviewer,admin}
  ANSWER_REVIEWER_ROLES: ${ANSWER_REVIEWER_ROLES:-teacher,interviewer,admin}
  EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
  TUNEAI_TEMPLATE: ${NEXT_PUBLIC_TUNEAI_TEMPLATE:-official}
  TUNEAI_PRODUCT_NAME: ${NEXT_PUBLIC_TUNEAI_PRODUCT_NAME:-TuneAI}
  TUNEAI_LOGO_TEXT: ${NEXT_PUBLIC_TUNEAI_LOGO_TEXT:-TuneAI}
  TUNEAI_LOGO_URL: ${NEXT_PUBLIC_TUNEAI_LOGO_URL:-}
  TUNEAI_REPOSITORY_URL: ${NEXT_PUBLIC_TUNEAI_REPOSITORY_URL:-https://github.com/CRUDoshleps/TuneAI}
  TUNEAI_DOCS_URL: ${NEXT_PUBLIC_TUNEAI_DOCS_URL:-https://github.com/CRUDoshleps/TuneAI#быстрый-запуск}
  TUNEAI_CONSULTATION_EMAIL: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL:-gsad1030@gmail.com}
  TUNEAI_CONSULTATION_PERSON: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON:-Sadovoi Grigorii}
  TUNEAI_BACKGROUND_COLOR: ${NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR:-}
  TUNEAI_SURFACE_COLOR: ${NEXT_PUBLIC_TUNEAI_SURFACE_COLOR:-}
  TUNEAI_PANEL_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_COLOR:-}
  TUNEAI_PANEL_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR:-}
  TUNEAI_TEXT_COLOR: ${NEXT_PUBLIC_TUNEAI_TEXT_COLOR:-}
  TUNEAI_MUTED_COLOR: ${NEXT_PUBLIC_TUNEAI_MUTED_COLOR:-}
  TUNEAI_LINE_COLOR: ${NEXT_PUBLIC_TUNEAI_LINE_COLOR:-}
  TUNEAI_ACCENT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_COLOR:-}
  TUNEAI_ACCENT_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR:-}
  TUNEAI_DANGER_COLOR: ${NEXT_PUBLIC_TUNEAI_DANGER_COLOR:-}
  TUNEAI_WARNING_COLOR: ${NEXT_PUBLIC_TUNEAI_WARNING_COLOR:-}
  TUNEAI_SUCCESS_COLOR: ${NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR:-}
  TUNEAI_CONFIG_JSON: ${NEXT_PUBLIC_TUNEAI_CONFIG_JSON:-}

x-backend-secrets: &backend-secrets
  - secret_key
  - postgres_password
  - rabbitmq_password
  - yandex_api_key

x-security: &security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  rabbitmq:
    <<: *security
    image: rabbitmq:4.1.8-alpine
    user: rabbitmq
    hostname: rabbitmq
    entrypoint: ["/usr/local/bin/tuneai-rabbitmq-entrypoint"]
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - /srv/apps/tuneai/deploy/rabbitmq-entrypoint.sh:/usr/local/bin/tuneai-rabbitmq-entrypoint:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - private
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  backend:
    <<: *security
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *backend-environment
    secrets: *backend-secrets
    volumes:
      - uploads:/data/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - private
      - egress
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  worker:
    <<: *security
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
    secrets: *backend-secrets
    volumes:
      - uploads:/data/uploads
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - private
      - egress
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  frontend:
    <<: *security
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NEXT_PUBLIC_TUNEAI_TEMPLATE: ${NEXT_PUBLIC_TUNEAI_TEMPLATE:-official}
      NEXT_PUBLIC_TUNEAI_PRODUCT_NAME: ${NEXT_PUBLIC_TUNEAI_PRODUCT_NAME:-TuneAI}
      NEXT_PUBLIC_TUNEAI_LOGO_TEXT: ${NEXT_PUBLIC_TUNEAI_LOGO_TEXT:-TuneAI}
      NEXT_PUBLIC_TUNEAI_LOGO_URL: ${NEXT_PUBLIC_TUNEAI_LOGO_URL:-}
      NEXT_PUBLIC_TUNEAI_REPOSITORY_URL: ${NEXT_PUBLIC_TUNEAI_REPOSITORY_URL:-https://github.com/CRUDoshleps/TuneAI}
      NEXT_PUBLIC_TUNEAI_DOCS_URL: ${NEXT_PUBLIC_TUNEAI_DOCS_URL:-https://github.com/CRUDoshleps/TuneAI}
      NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_EMAIL:-}
      NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON: ${NEXT_PUBLIC_TUNEAI_CONSULTATION_PERSON:-}
      NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR: ${NEXT_PUBLIC_TUNEAI_BACKGROUND_COLOR:-}
      NEXT_PUBLIC_TUNEAI_SURFACE_COLOR: ${NEXT_PUBLIC_TUNEAI_SURFACE_COLOR:-}
      NEXT_PUBLIC_TUNEAI_PANEL_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_COLOR:-}
      NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_PANEL_SOFT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_TEXT_COLOR: ${NEXT_PUBLIC_TUNEAI_TEXT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_MUTED_COLOR: ${NEXT_PUBLIC_TUNEAI_MUTED_COLOR:-}
      NEXT_PUBLIC_TUNEAI_LINE_COLOR: ${NEXT_PUBLIC_TUNEAI_LINE_COLOR:-}
      NEXT_PUBLIC_TUNEAI_ACCENT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR: ${NEXT_PUBLIC_TUNEAI_ACCENT_SOFT_COLOR:-}
      NEXT_PUBLIC_TUNEAI_DANGER_COLOR: ${NEXT_PUBLIC_TUNEAI_DANGER_COLOR:-}
      NEXT_PUBLIC_TUNEAI_WARNING_COLOR: ${NEXT_PUBLIC_TUNEAI_WARNING_COLOR:-}
      NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR: ${NEXT_PUBLIC_TUNEAI_SUCCESS_COLOR:-}
      NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS: ${NEXT_PUBLIC_TUNEAI_EMBED_ALLOWED_ORIGINS:-${EMBED_ALLOWED_ORIGINS:-}}
      NEXT_PUBLIC_TUNEAI_CONFIG_JSON: ${NEXT_PUBLIC_TUNEAI_CONFIG_JSON:-}
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      private:
      edge:
        aliases:
          - tuneai-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  migrate:
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
    secrets: *backend-secrets
    networks:
      - private
      - egress
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    profiles:
      - tools

  bootstrap-admin:
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python", "-m", "app.scripts.bootstrap_admin"]
    environment:
      <<: *backend-environment
    secrets:
      - secret_key
      - postgres_password
      - rabbitmq_password
      - bootstrap_admin_email
      - bootstrap_admin_password
    networks:
      - private
      - egress
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    profiles:
      - tools

networks:
  private:
    internal: true
  egress:
  edge:
    external: true
    name: platform-edge_default

volumes:
  rabbitmq-data:
  uploads:

secrets:
  secret_key:
    file: /run/apps/tuneai/secret_key
  postgres_password:
    file: /run/apps/tuneai/postgres_password
  rabbitmq_password:
    file: /run/apps/tuneai/rabbitmq_password
  yandex_api_key:
    file: /run/apps/tuneai/yandex_api_key
  bootstrap_admin_email:
    file: /run/apps/tuneai/bootstrap_admin_email
  bootstrap_admin_password:
    file: /run/apps/tuneai/bootstrap_admin_password
